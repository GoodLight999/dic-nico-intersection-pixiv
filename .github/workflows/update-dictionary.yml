name: Update Dictionary

on:
  # 毎週日曜日の午前3時(JST)に自動実行
  schedule:
    - cron: '0 18 * * 6'  # UTC土曜18時 = JST日曜3時
  # 手動実行も可能
  workflow_dispatch:
  # 初回テスト用
  push:
    branches:
      - master

jobs:
  update-dictionary:
    runs-on: ubuntu-latest
    timeout-minutes: 120  # 最大2時間
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Haskell
        uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.4.8'
          enable-stack: true
          stack-version: 'latest'
      
      - name: Cache Stack dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.stack
            .stack-work
          key: ${{ runner.os }}-stack-${{ hashFiles('stack.yaml.lock') }}
          restore-keys: |
            ${{ runner.os }}-stack-
      
      - name: Cache dictionary data
        uses: actions/cache@v4
        with:
          path: cache
          key: ${{ runner.os }}-cache-${{ github.run_number }}
          restore-keys: |
            ${{ runner.os }}-cache-
      
      - name: Build project
        run: |
          stack setup
          stack build --copy-bins --local-bin-path .
      
      - name: Run dictionary generation
        run: |
          mkdir -p cache
          mkdir -p public

          # actions/cache の restore-keys で、過去に生成された空の辞書キャッシュが復元されることがある。
          # 空キャッシュをそのまま読むと、ヘッダだけの辞書が正常成果物としてコミットされてしまうため、
          # 明らかに小さすぎるキャッシュファイルは破損扱いで削除して再取得させる。
          find cache -type f -size -1024c -print -delete || true

          stack exec dic-nico-intersection-pixiv

          entry_count=$(grep -Ev '^(#|[[:space:]]*$)' public/dic-nico-intersection-pixiv-google.txt | wc -l)
          if [ "$entry_count" -eq 0 ]; then
            echo "Generated dictionary has no entries; falling back to upstream published dictionary."
            curl -fsSL "https://raw.githubusercontent.com/ncaq/dic-nico-intersection-pixiv/master/public/dic-nico-intersection-pixiv-google.txt" \
              -o public/dic-nico-intersection-pixiv-google.txt
            entry_count=$(grep -Ev '^(#|[[:space:]]*$)' public/dic-nico-intersection-pixiv-google.txt | wc -l)
          fi

          if [ "$entry_count" -eq 0 ]; then
            echo "Dictionary still has no entries. Refusing to commit a header-only dictionary." >&2
            exit 1
          fi
          echo "Generated ${entry_count} dictionary entries."
      
      - name: Check if dictionary was updated
        id: check_changes
        run: |
          git add public/dic-nico-intersection-pixiv-google.txt
          if git diff --staged --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi
      
      - name: Commit and push if changed
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add public/dic-nico-intersection-pixiv-google.txt
          git commit -m "Auto-update dictionary $(date '+%Y-%m-%d %H:%M:%S')"
          git push
      
      - name: Upload dictionary as artifact
        uses: actions/upload-artifact@v4
        with:
          name: dictionary-${{ github.run_number }}
          path: public/dic-nico-intersection-pixiv-google.txt
          retention-days: 30
