name: Update Dictionary

on:
  # 毎週日曜日の午前3時(JST)に自動実行
  schedule:
    - cron: '0 18 * * 6'  # UTC土曜18時 = JST日曜3時
  # 手動実行も可能
  workflow_dispatch:
  # 初回テスト用
  push:
    branches:
      - master

jobs:
  update-dictionary:
    runs-on: ubuntu-latest
    timeout-minutes: 120  # 最大2時間
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Haskell
        uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.4.8'
          enable-stack: true
          stack-version: 'latest'
      
      - name: Cache Stack dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.stack
            .stack-work
          key: ${{ runner.os }}-stack-${{ hashFiles('stack.yaml.lock') }}
          restore-keys: |
            ${{ runner.os }}-stack-
      
      - name: Cache dictionary data
        uses: actions/cache@v4
        with:
          path: cache
          key: ${{ runner.os }}-cache-${{ github.run_number }}
          restore-keys: |
            ${{ runner.os }}-cache-
      
      - name: Build project
        run: |
          stack setup
          stack build --copy-bins --local-bin-path .
      
      - name: Run dictionary generation
        run: |
          mkdir -p cache
          mkdir -p public

          echo "--- probe nico urls ---"
          for ua_name in desktop mobile; do
            if [ "$ua_name" = desktop ]; then
              ua="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124 Safari/537.36"
            else
              ua="Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.0 Mobile/15E148 Safari/604.1"
            fi
            for url in \
              "https://dic.nicovideo.jp/m/a/a" \
              "https://dic.nicovideo.jp/m/yp/a/%E3%82%A2" \
              "https://dic.nicovideo.jp/a/%E3%82%A2" \
              "http://dic.nicovideo.jp/m/a/a"; do
              echo "--- ${ua_name} ${url} ---"
              code=$(curl -L -sS -A "$ua" -H 'Accept-Language: ja-JP,ja;q=0.9' -o /tmp/nico-probe.html -w '%{http_code}' "$url" || true)
              echo "http_code=${code}"
              wc -c /tmp/nico-probe.html || true
              grep -oE 'href="[^"]+"|class="[^"]+"|<title>[^<]+' /tmp/nico-probe.html | head -n 40 || true
            done
          done

          echo "--- probe pixiv sitemap ---"
          curl -fsSL -A "Mozilla/5.0" "https://dic.pixiv.net/sitemap.xml" -o /tmp/pixiv-sitemap.xml
          wc -c /tmp/pixiv-sitemap.xml
          head -c 2000 /tmp/pixiv-sitemap.xml
          echo

          find cache -type f -size -1024c -print -delete || true

          stack exec dic-nico-intersection-pixiv

          entry_count=$(grep -Ev '^(#|[[:space:]]*$)' public/dic-nico-intersection-pixiv-google.txt | wc -l)
          if [ "$entry_count" -eq 0 ]; then
            echo "Dictionary generation produced no entries. Refusing to commit a header-only dictionary." >&2
            exit 1
          fi
          echo "Generated ${entry_count} dictionary entries."
      
      - name: Check if dictionary was updated
        id: check_changes
        run: |
          git add public/dic-nico-intersection-pixiv-google.txt
          if git diff --staged --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi
      
      - name: Commit and push if changed
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add public/dic-nico-intersection-pixiv-google.txt
          git commit -m "Auto-update dictionary $(date '+%Y-%m-%d %H:%M:%S')"
          git push
      
      - name: Upload dictionary as artifact
        uses: actions/upload-artifact@v4
        with:
          name: dictionary-${{ github.run_number }}
          path: public/dic-nico-intersection-pixiv-google.txt
          retention-days: 30
