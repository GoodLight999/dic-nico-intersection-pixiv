name: Update Dictionary

on:
  push:
    paths:
      - 'public/nico-raw.txt'
      - 'public/pixiv-raw.txt'
      - 'public/nico-special-yomi.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-dictionary
  cancel-in-progress: true

jobs:
  update-dictionary:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Haskell
        uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.4.8'
          enable-stack: true
          stack-version: 'latest'

      - name: Cache Stack dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.stack
            .stack-work
          key: ${{ runner.os }}-stack-${{ hashFiles('stack.yaml.lock') }}
          restore-keys: |
            ${{ runner.os }}-stack-

      - name: Build project
        run: |
          stack setup
          stack build --copy-bins --local-bin-path .

      - name: Run dictionary generation
        run: |
          set -euo pipefail
          rm -rf cache
          mkdir -p public

          stack exec dic-nico-intersection-pixiv

          entry_count=$(grep -Ev '^(#|[[:space:]]*$)' public/dic-nico-intersection-pixiv-google.txt | wc -l)
          min_entries=1000
          if [ "$entry_count" -lt "$min_entries" ]; then
            echo "Dictionary generation produced only ${entry_count} entries. Refusing to commit a broken dictionary." >&2
            exit 1
          fi
          echo "Generated ${entry_count} dictionary entries."

      - name: Check if dictionary was updated
        id: check_changes
        run: |
          git add public/dic-nico-intersection-pixiv-google.txt
          if git diff --staged --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push if changed
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add public/dic-nico-intersection-pixiv-google.txt
          git commit -m "Auto-update dictionary $(date '+%Y-%m-%d %H:%M:%S')"
          git push

      - name: Upload dictionary as artifact
        uses: actions/upload-artifact@v4
        with:
          name: dictionary-${{ github.run_number }}
          path: public/dic-nico-intersection-pixiv-google.txt
          retention-days: 30
